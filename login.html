<!DOCTYPE html>
<html>
<head>
    <title>Bakery Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff3e6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            width: 320px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1 {
            color: #8b4513;
            margin-bottom: 5px;
        }

        h2 {
            color: #555;
            margin-bottom: 25px;
        }

        input[type="text"],
        input[type="password"] {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        input[type="submit"] {
            width: 98%;
            padding: 12px;
            margin-top: 15px;
            background-color: #8b4513;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #6f350f;
        }

        p {
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🍰 Sweet Bakery</h1>
        <h2>Login</h2>

        <form>
            <input type="text" placeholder="Username" required><br>

            <input type="password" placeholder="Password" required><br>

            <input type="submit" value="Login">
        </form>

        <p>Bakery Management System</p>

    </div>

</body>
</html>
