<!DOCTYPE html>
<html>
<head>
    <title>Bakery Catalogue</title>

    <style>
        body {
            background-color: #fff3e6;
            font-family: Arial;
        }

        h1 {
            color: #8b4513;
            text-align: center;
        }

        table {
            width: 80%;
            margin: auto;
            background-color: white;
            border-collapse: collapse;
        }

        th {
            background-color: #d2691e;
            color: white;
            padding: 15px;
        }

        td {
            padding: 12px;
            text-align: center;
            color: #5a2d0c;
        }

        tr:nth-child(even) {
            background-color: #ffe4c4;
        }

        tr:hover {
            background-color: #ffd1a9;
        }

        a {
            color: #d2691e;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🍰 Bakery Catalogue</h1>

    <hr>

    <table border="1">

        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Category</th>
        </tr>

        <tr>
            <td>Chocolate Cake</td>
            <td>₹500</td>
            <td>Cake</td>
        </tr>

        <tr>
            <td>Black Forest Cake</td>
            <td>₹600</td>
            <td>Cake</td>
        </tr>

        <tr>
            <td>Fresh Bread</td>
            <td>₹40</td>
            <td>Bread</td>
        </tr>

        <tr>
            <td>Chocolate Pastry</td>
            <td>₹60</td>
            <td>Pastry</td>
        </tr>

        <tr>
            <td>Cookies</td>
            <td>₹100</td>
            <td>Biscuits</td>
        </tr>

    </table>

</html>
